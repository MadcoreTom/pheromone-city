<!DOCTYPE html>
<html>

<head>
    <title>Phere</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: teal;
            min-height: 100vh;
            margin: 0;
        }
        #menu-list-build {
            display: flex;
            gap:5px;
            align-items: stretch;
            height: 100%;
            flex-grow: 1;
        }
        #menu-list-inspect {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            max-height: 80px;
            gap: 6px;
            flex-grow: 1;
            align-content: start;
        }
        #menu-list-inspect .field-row{
            margin: 0;
        }
        .camera-controls  {
            display: flex;
            flex-wrap: wrap;
            max-width: 100px;
            align-items: stretch;
        }
        .camera-controls button {
            min-width: 26%;
            flex-grow: 1;
        }
        button:disabled{
            background: #e4e4dc;
            color: black;
            border: none;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
</head>

<body>
    <div class="window" style="display:inline-block">
        <div class="title-bar">
            <div class="title-bar-text">Pheremone City</div>
            <div class="title-bar-controls">
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <div id="replace-with-game">Loading</div>
            <hr />
            <div style="display:flex; gap:16px;">
                <fieldset class="camera-controls">
                    <legend>Camera Controls</legend>
                    <button data-action="zoomOut"><img src="icons/magnifying-glass-minus.svg" alt="zoom out" width="20"/></button>
                    <button data-action="zoomIn"><img src="icons/magnifying-glass-plus.svg" alt="zoom in" width="20"/></button>
                    <br />
                    <button data-action="rotCW"><img src="icons/arrow-rotate-right.svg" alt="rotate clockwise" width="20"/></button>
                    <button data-action="rotCCW"><img src="icons/arrow-rotate-left.svg" alt="rotate counter-clockwise" width="20"/></button>
                </fieldset>
                <fieldset>
                    <legend>Build Tool</legend>
                    <div id="menu-list-build">
                    </div>
                </fieldset>
                <fieldset id="menu-list-inspect">
                    <legend>Inspection View</legend>
                </fieldset>
                <fieldset id="menu-list-inspect">
                    <legend>Other Controls</legend>
                    <div id="star-indicator"></div>
                    <button data-action="pause">Pause</button>
                </fieldset>
            </div>
        </div>
        <div class="status-bar">
            <p class="status-bar-field" id="cash-status">$ -</p>
            <p class="status-bar-field">Citizens say "Build more houses"</p>
            <p class="status-bar-field" id="population-status">Population: ?</p>
        </div>
    </div>
    <div class="window" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1000; display: none" id="popup">
        <div class="title-bar">
            <div class="title-bar-text">Welcome</div>
            <div class="title-bar-controls">
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <div id="popup-content"></div>
           
            <div style="text-align:right; margin-top: 1em;" id="popup-buttons">
                <button>OK</button>
            </div>
        </div>
    </div>
    <script src="./js/main.js"></script>

</body>

</html>
