<!DOCTYPE html>
<html>

<head>
    <title>Phere</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: teal;
            min-height: 100vh;
            margin: 0;
        }
        #menu-list-build {
            display: flex;
            gap:5px;
            align-items: stretch;
            height: 100%;
            flex-grow: 1;
        }
        #menu-list-inspect {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            max-height: 80px;
            gap: 6px;
            flex-grow: 1;
            align-content: start;
        }
        #menu-list-inspect .field-row{
            margin: 0;
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
</head>

<body>
    <div class="window" style="display:inline-block">
        <div class="title-bar">
            <div class="title-bar-text">Pheremone City</div>
            <div class="title-bar-controls">
                <button aria-label="Close"></button>
            </div>
        </div>
        <div class="window-body">
            <div id="replace-with-game">Loading</div>
            <hr />
            <div style="display:flex; gap:16px;">
                <fieldset>
                    <legend>Camera Controls</legend>
                    <button data-action="zoomOut">➖</button>
                    <button data-action="zoomIn">➕</button>
                    <br />
                    <button data-action="rotCW">🔃</button>
                    <button data-action="rotCCW">🔄️</button>
                </fieldset>
                <fieldset>
                    <legend>Build Tool</legend>
                    <div id="menu-list-build">
                        <button data-tool="Demolish">Demolish</button>
                    </div>
                </fieldset>
                <fieldset  id="menu-list-inspect">
                    <legend>Inspection View</legend>
                </fieldset>
            </div>
        </div>
        <div class="status-bar">
            <p class="status-bar-field">Click to place a house</p>
            <p class="status-bar-field">Citizens say "Build more houses"</p>
            <p class="status-bar-field" id="population-status">Population: ?</p>
        </div>
    </div>
    <script src="./js/main.js"></script>

</body>

</html>
